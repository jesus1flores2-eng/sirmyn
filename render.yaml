services:
  - type: web
    name: sirmyn
    env: python
    buildCommand: |
      echo "🚀 Iniciando build..."
      pip install -r requirements.txt
      echo "📥 Creando tablas..."
      python -c "from app import create_app; app = create_app(); app.app_context().push(); from app.extensions import db; db.create_all()"
      echo "📥 Cargando datos..."
      python cargar_datos_municipio.py
      echo "✅ Build completado"
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_EMERGENCIAS_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: SERVER_URL
        sync: false
      - key: UPLOAD_FOLDER
        value: uploads
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_COMUNICACION_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_COMUNICACION_API_KEY
        sync: false
      - key: CLOUDINARY_COMUNICACION_API_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: OPERADOR_NUMERO
        sync: false
      - key: TRACKSOLID_APP_KEY
        sync: false
      - key: TRACKSOLID_APP_SECRET
        sync: false
      - key: TRACKSOLID_USER_PWD_MD5
        sync: false
